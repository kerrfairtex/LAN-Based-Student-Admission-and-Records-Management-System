; PHP configuration for Vercel (vercel-php builder).
; This file is read by the vercel-php builder during build to
; configure php.ini. It overrides any settings from .user.ini,
; which is NOT honored by the vercel-php runtime.

; Security: never expose errors to the browser
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Session: use database-backed sessions in production
; (configured at runtime via session_set_save_handler in config/app.php)
session.save_handler = user
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Upload limits
upload_max_filesize = 50M
post_max_size = 50M
memory_limit = 512M
max_execution_time = 15
max_input_vars = 10000

; Extensions needed by the application
extension = pdo.so
extension = pdo_pgsql.so
extension = pgsql.so
extension = json.so
extension = mbstring.so
extension = openssl.so
extension = curl.so
