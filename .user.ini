; User-level PHP config for TRAC JHS SARMS.
;
; Honored by PHP when the file lives in the script's directory tree
; (CGI/FastCGI SAPIs, including PHP-FPM and Render's PHP image). Read
; once per request at startup, BEFORE any script code runs — so it
; overrides any ini_set() calls in PHP files. ini_set() for
; display_errors is also unreliable on some SAPIs; .user.ini is the
; portable, SAPI-respecting way to do it.
;
; display_errors=0 keeps raw PDOException text, file paths, and stack
; frames out of HTTP responses. Errors still flow to PHP's error_log
; (→ Render log stream) so operators can investigate. The branded
; 500 page in config/app.php's set_exception_handler catches anything
; that escapes per-page try/catch blocks.
;
; log_errors=1 + error_log=php://stderr sends errors to Render's log
; stream; without that, on the Render PHP image they can land in an
; unreachable place.
;
; SECURITY NOTE: do NOT set display_errors=1 here. If you need to
; debug locally, override at runtime with APP_DEBUG=1 in your env
; and gate the ini_set() in code — never flip this file.

display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = php://stderr